<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ship It</title>
<meta name="description" content="A game-dev focus guild: scope projects down, work in focus runs, keep streaks, post devlogs and ship games.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%23ff9d45' d='M0 5h6V0l10 8-10 8v-5H0z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pixelify+Sans:wght@400;600;700&family=Silkscreen&display=swap">
<style>
/* Layout: a handheld-console shell. Sticky status bar (level, XP, streak) over tabbed screens; boards are pixel-bordered panels. */
:root {
  --bg: #e6e9f4; --panel: #f6f7fc; --panel-2: #dde1ef; --ink: #1d1f33; --muted: #575c80;
  --line: #b9bfd8; --accent: #c9530c; --accent-ink: #ffffff; --cool: #0f6f7a; --cool-soft: #cfeef0;
  --good: #2b7d3f; --bad: #b8321f; --shadow: #1d1f33; --xp: #e39b00;
  --f-display: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  --f-label: "Silkscreen", "Courier New", ui-monospace, monospace;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --px: 3px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141626; --panel: #1e2137; --panel-2: #272b47; --ink: #eceefb; --muted: #a1a6c9;
  --line: #3a3f66; --accent: #ff9d45; --accent-ink: #1b1206; --cool: #62d6de; --cool-soft: #183a44;
  --good: #73d68c; --bad: #ff7d6e; --shadow: #06070e; --xp: #ffc23d; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141626; --panel: #1e2137; --panel-2: #272b47; --ink: #eceefb; --muted: #a1a6c9;
  --line: #3a3f66; --accent: #ff9d45; --accent-ink: #1b1206; --cool: #62d6de; --cool-soft: #183a44;
  --good: #73d68c; --bad: #ff7d6e; --shadow: #06070e; --xp: #ffc23d; color-scheme: dark }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
[hidden] { display: none !important; }
.gate { max-width: 460px; margin: 8vh auto 40px; }
.gate .tabs2 { display: flex; gap: 4px; }
code, .code { font-family: var(--f-label); background: var(--panel-2); padding: 2px 6px; overflow-wrap: anywhere; }
.err { color: var(--bad); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; line-height: 1.15; text-wrap: balance; margin: 0; }
h2 { font-size: 1.5rem; } h3 { font-size: 1.15rem; }
p { margin: 0; }
a { color: var(--cool); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--cool); outline-offset: 2px; }
.label { font-family: var(--f-label); font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Status bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: var(--px) solid var(--line); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 10px; }
.brand { font-family: var(--f-display); font-size: 1.6rem; font-weight: 700; letter-spacing: 0.02em; display: flex; align-items: center; gap: 8px; }
.brand .mark { width: 22px; height: 22px; background: var(--accent); box-shadow: 3px 3px 0 var(--shadow); display: inline-block; clip-path: polygon(0 30%, 40% 30%, 40% 0, 100% 50%, 40% 100%, 40% 70%, 0 70%); }
.me { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; flex: 1; min-width: 0; justify-content: flex-end; }
.lvl { font-family: var(--f-label); font-size: 0.78rem; white-space: nowrap; }
.xpbar { width: 160px; max-width: 40vw; height: 12px; background: var(--panel-2); border: 2px solid var(--line); position: relative; }
.xpbar > i { position: absolute; inset: 0 auto 0 0; background: repeating-linear-gradient(90deg, var(--xp) 0 6px, transparent 6px 8px); }
.streak { font-family: var(--f-label); font-size: 0.78rem; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.flame { width: 12px; height: 14px; background: var(--accent); clip-path: polygon(50% 0, 75% 30%, 100% 55%, 85% 100%, 15% 100%, 0 55%, 30% 35%); }
.flame.off { background: var(--line); }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: thin; }
nav.tabs a { font-family: var(--f-label); font-size: 0.78rem; text-decoration: none; color: var(--muted); padding: 7px 12px; border: 2px solid transparent; white-space: nowrap; }
nav.tabs a:hover { color: var(--ink); border-color: var(--line); }
nav.tabs a[aria-current="page"] { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
.conn { font-family: var(--f-label); font-size: 0.68rem; color: var(--muted); }

main { padding-block: 22px 60px; display: grid; gap: 22px; }

.panel { background: var(--panel); border: var(--px) solid var(--line); padding: 18px; min-width: 0; }
.panel.hero { box-shadow: 6px 6px 0 var(--shadow); border-color: var(--ink); }
.stack { display: grid; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }

.btn { font-family: var(--f-label); font-size: 0.78rem; cursor: pointer; border: 2px solid var(--ink); background: var(--panel); color: var(--ink); padding: 8px 14px; box-shadow: 3px 3px 0 var(--shadow); transition: transform .06s, box-shadow .06s; }
.btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--shadow); }
.btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--shadow); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--shadow); }
.btn.cool { background: var(--cool); color: var(--bg); border-color: var(--shadow); }
.btn.ghost { box-shadow: none; border-color: var(--line); }
.btn.ghost:hover { border-color: var(--ink); transform: none; }
.btn.small { padding: 4px 8px; font-size: 0.68rem; box-shadow: 2px 2px 0 var(--shadow); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.btn.on { background: var(--cool-soft); }

input[type=text], input[type=url], input[type=number], input[type=date], input[type=email], input[type=password], textarea, select {
  background: var(--bg); border: 2px solid var(--line); padding: 8px 10px; width: 100%; min-width: 0; border-radius: 0; }
input:focus, textarea:focus, select:focus { border-color: var(--cool); outline: none; }
textarea { resize: vertical; min-height: 70px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field.grow { flex: 1 1 220px; }

.banner { border: var(--px) dashed var(--accent); padding: 12px 16px; background: var(--panel); display: grid; gap: 4px; }
.banner.info { border-color: var(--cool); }
.banner.warn { border-color: var(--bad); }

/* Quest board */
.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 760px) { .board { grid-template-columns: 1fr; } }
.col { background: var(--panel-2); border: 2px solid var(--line); padding: 10px; display: grid; gap: 8px; align-content: start; min-height: 120px; }
.col h3 { font-size: 1rem; display: flex; justify-content: space-between; align-items: baseline; }
.quest { background: var(--panel); border: 2px solid var(--line); padding: 10px; display: grid; gap: 8px; }
.quest.done .qt { text-decoration: line-through; color: var(--muted); }
.qt { overflow-wrap: anywhere; }
.chip { font-family: var(--f-label); font-size: 0.64rem; padding: 2px 6px; border: 2px solid currentColor; display: inline-block; white-space: nowrap; }
.chip.s { color: var(--good); } .chip.m { color: var(--cool); } .chip.b { color: var(--bad); }
.chip.core { color: var(--accent); }
.empty { color: var(--muted); font-size: 0.9rem; padding: 8px 2px; }

.meter { height: 14px; background: var(--panel-2); border: 2px solid var(--line); position: relative; }
.meter > i { position: absolute; inset: 0 auto 0 0; background: var(--cool); }
.meter.xp > i { background: var(--xp); }

/* Wizard */
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.steps span { font-family: var(--f-label); font-size: 0.66rem; padding: 3px 8px; border: 2px solid var(--line); color: var(--muted); }
.steps span.cur { border-color: var(--accent); color: var(--accent); }
.sortlist { display: grid; gap: 8px; }
.sortrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; background: var(--panel-2); padding: 8px 10px; border: 2px solid var(--line); }
.sortrow .t { flex: 1 1 200px; min-width: 0; overflow-wrap: anywhere; }
.seg { display: flex; }
.seg button { font-family: var(--f-label); font-size: 0.66rem; padding: 5px 8px; border: 2px solid var(--line); background: var(--panel); cursor: pointer; margin-left: -2px; }
.seg button.sel.core { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); position: relative; }
.seg button.sel.nice { background: var(--cool); color: var(--bg); border-color: var(--cool); position: relative; }
.seg button.sel.sequel { background: var(--muted); color: var(--bg); border-color: var(--muted); position: relative; }

/* Focus */
.timer { font-family: var(--f-display); font-size: clamp(4rem, 16vw, 8.5rem); font-weight: 700; line-height: 1; text-align: center; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
.timer.running { color: var(--accent); }
.dungeon { position: relative; height: 22px; background: var(--panel-2); border: 2px solid var(--line); overflow: hidden; }
.dungeon > i { position: absolute; inset: 0 auto 0 0; background: repeating-linear-gradient(90deg, var(--accent) 0 10px, transparent 10px 12px); }
.dungeon .hero-dot { position: absolute; top: 3px; width: 12px; height: 12px; background: var(--ink); transform: translateX(-6px); }
.reward { text-align: center; display: grid; gap: 8px; justify-items: center; }
.reward .big { font-family: var(--f-display); font-size: 2.4rem; color: var(--xp); }

/* People */
.avatar { width: 34px; height: 34px; flex: none; image-rendering: pixelated; border: 2px solid var(--line); object-fit: cover; display: inline-grid; place-items: center; font-family: var(--f-label); font-size: .8rem; color: #fff; }
.members { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.mcard { background: var(--panel); border: var(--px) solid var(--line); padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.mcard.live { border-color: var(--accent); }
.mhead { display: flex; gap: 10px; align-items: center; min-width: 0; }
.mhead .n { font-weight: 700; overflow-wrap: anywhere; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stat { background: var(--panel-2); padding: 6px 8px; display: grid; }
.stat b { font-family: var(--f-display); font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.livedot { display: inline-block; width: 9px; height: 9px; background: var(--accent); margin-right: 6px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }
.badges { display: flex; flex-wrap: wrap; gap: 5px; }
.badge { font-family: var(--f-label); font-size: 0.6rem; padding: 2px 6px; background: var(--panel-2); border: 2px solid var(--xp); color: var(--ink); }

.feed { display: grid; gap: 10px; }
.entry { display: grid; grid-template-columns: auto 1fr; gap: 10px; background: var(--panel); border: 2px solid var(--line); padding: 10px 12px; min-width: 0; }
.entry .body { min-width: 0; display: grid; gap: 4px; }
.entry .txt { overflow-wrap: anywhere; }
.hf { font-family: var(--f-label); font-size: 0.66rem; }

.ships { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.ship { background: var(--panel); border: var(--px) solid var(--ink); box-shadow: 5px 5px 0 var(--shadow); padding: 14px; display: grid; gap: 8px; min-width: 0; }
.ship .cart { height: 70px; background: repeating-linear-gradient(45deg, var(--panel-2) 0 8px, var(--bg) 8px 16px); border: 2px solid var(--line); display: grid; place-items: center; font-family: var(--f-display); font-size: 1.3rem; color: var(--accent); text-align: center; padding: 6px; overflow-wrap: anywhere; }

.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 560px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 2px solid var(--line); vertical-align: middle; }
th { font-family: var(--f-label); font-size: 0.68rem; color: var(--muted); font-weight: 400; }

details summary { cursor: pointer; font-family: var(--f-label); font-size: 0.74rem; color: var(--muted); }
ol.howto { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }

.post { background: var(--panel); border: var(--px) solid var(--line); padding: 14px; display: grid; gap: 8px; min-width: 0; }
.post.new { border-color: var(--accent); }
.post .txt, .reply .txt { overflow-wrap: anywhere; white-space: pre-wrap; }
.chip.tag-chat { color: var(--muted); } .chip.tag-help { color: var(--bad); } .chip.tag-showcase { color: var(--xp); } .chip.tag-playtest { color: var(--cool); }
.thread { display: grid; gap: 8px; border-left: var(--px) solid var(--line); padding-left: 12px; margin-top: 4px; }
.reply { display: grid; grid-template-columns: auto 1fr; gap: 8px; min-width: 0; }
.reply .avatar { width: 26px; height: 26px; font-size: .7rem; }
.reply .body { min-width: 0; display: grid; gap: 2px; }
.online { display: inline-flex; align-items: center; gap: 6px; }
.online .avatar { width: 24px; height: 24px; font-size: .68rem; }
#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); font-family: var(--f-label); font-size: .76rem; padding: 10px 16px; box-shadow: 4px 4px 0 var(--accent); z-index: 20; max-width: calc(100vw - 32px); }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 15; width: 100%; height: 100%; }
@media (prefers-reduced-motion: reduce) { .livedot { animation: none; } .btn { transition: none; } }
</style>

<div id="app"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(() => {
"use strict";
/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const dstr = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => dstr(new Date());
const addDays = (s, n) => { const [y, m, d] = s.split("-").map(Number); return dstr(new Date(y, m - 1, d + n)); };
const month = () => today().slice(0, 7);
const rid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const clone = (o) => JSON.parse(JSON.stringify(o ?? null));
const safeUrl = (u) => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ""; } catch { return ""; } };
const daysLeft = (iso) => { if (!iso) return null; return Math.ceil((new Date(iso + "T23:59:59") - new Date()) / 864e5); };
const fmtDate = (iso) => { try { return new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" }); } catch { return ""; } };
const ls = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }, del(k) { try { localStorage.removeItem(k); } catch {} } };

/* ---------- game rules ---------- */
const QUEST_XP = { s: 10, m: 25, b: 60 };
const SIZE_NAME = { s: "Small", m: "Medium", b: "Boss" };
const BOX = { "1w": { days: 7, core: 3, name: "1 week" }, "2w": { days: 14, core: 5, name: "2 weeks" }, "1m": { days: 30, core: 8, name: "1 month" } };
const TITLES = [[1, "Tutorial NPC"], [2, "Button Masher"], [3, "Prototype Tinkerer"], [5, "Jam Survivor"], [7, "Bug Slayer"], [10, "Shipped Dev"], [14, "Seasoned Dev"], [20, "Legendary"]];
const xpAt = (n) => 50 * n * (n - 1);
const levelOf = (xp) => { let n = 1; while (xp >= xpAt(n + 1)) n++; return n; };
const titleOf = (lv) => TITLES.filter(([l]) => lv >= l).pop()[1];
const SHIELDS = 2;

function streakOf(days) {
  const set = new Set(days || []);
  let d = today(), streak = 0, used = {}, pending = [];
  if (!set.has(d)) d = addDays(d, -1);
  for (let i = 0; i < 800; i++) {
    if (set.has(d)) { streak++; pending.forEach((m) => (used[m] = (used[m] || 0) + 1)); pending = []; }
    else {
      const m = d.slice(0, 7);
      const usedM = (used[m] || 0) + pending.filter((x) => x === m).length;
      if (streak > 0 && usedM < SHIELDS) pending.push(m); else break;
    }
    d = addDays(d, -1);
  }
  return { streak, shieldsLeft: SHIELDS - (used[month()] || 0), doneToday: set.has(today()) };
}
function badgesOf(m) {
  const b = [];
  if (m.runs >= 1) b.push("First Run"); if (m.runs >= 10) b.push("10 Runs"); if (m.runs >= 50) b.push("50 Runs");
  if (m.totalMinutes >= 600) b.push("10 Hours"); if (m.totalMinutes >= 3000) b.push("50 Hours");
  if (m.bossDone >= 1) b.push("Boss Slayer"); if (m.questsDone >= 25) b.push("Questmaster");
  const s = streakOf(m.days).streak; if (s >= 7) b.push("7-Day Streak"); if (s >= 30) b.push("30-Day Streak");
  if ((m.helpCount || 0) >= 1) b.push("Helper"); if ((m.helpCount || 0) >= 10) b.push("Mentor");
  if ((m.raids || 0) >= 1) b.push("Raider"); if ((m.raids || 0) >= 10) b.push("Raid Leader");
  if ((m.ships || []).length >= 1) b.push("Shipped"); if ((m.ships || []).length >= 3) b.push("Serial Shipper");
  return b;
}
const blankMember = () => ({ xp: 0, days: [], monthMinutes: {}, totalMinutes: 0, runs: 0, questsDone: 0, bossDone: 0, activeQuest: "", projectName: "", deadline: "", logs: [], ships: [], posts: [], replies: [], joinedAt: new Date().toISOString(), lastActive: "" });
const normMember = (d) => Object.assign(blankMember(), d || {});
const blankBoard = () => ({ project: null, quests: [] });
const normBoard = (d) => Object.assign(blankBoard(), d || {});

/* ---------- state ---------- */
const CFG = window.SHIPIT_CONFIG || {};
const S = {
  sb: null, chan: null, uid: null, email: "", role: null, phase: "loading", needsAdmin: false,
  gate: { tab: new URLSearchParams(location.search).get("invite") ? "join" : "signin", err: "", busy: false, info: "" },
  conn: "ok", member: blankMember(), board: blankBoard(), members: {}, cheers: {}, profiles: {}, invites: [],
  settings: { announcement: "", challenge: null, goalHours: 0 }, peers: [],
  focus: null, ui: { open: {}, wiz: null, reward: null, lost: null, shipOpen: false, confirmNew: false, confirmRemove: null, newInvite: null, dur: ls.get("shipit.dur") || 25, strict: ls.get("shipit.strict") ?? true },
  sound: ls.get("shipit.sound") ?? true,
};
const myId = () => S.uid || "local";
const isAdmin = () => S.role === "admin";
const inviteFromUrl = () => (new URLSearchParams(location.search).get("invite") || "").toUpperCase();

/* ---------- persistence ---------- */
const writers = {};
const WRITE = {
  member: (v) => S.sb.from("members").upsert({ id: S.uid, data: v, updated_at: new Date().toISOString() }),
  board: (v) => S.sb.from("boards").upsert({ id: S.uid, data: v, updated_at: new Date().toISOString() }),
  cheers: (v) => S.sb.from("cheers").upsert({ id: S.uid, given: v.given, updated_at: new Date().toISOString() }),
  settings: (v) => S.sb.from("settings").upsert({ id: 1, data: v, updated_at: new Date().toISOString() }),
};
function persist(key, getData) {
  if (!S.sb || !S.uid || !S.role) return;
  const w = writers[key] || (writers[key] = { busy: false, dirty: false });
  w.get = getData;
  if (w.busy) { w.dirty = true; return; }
  w.busy = true;
  (async () => {
    try { do { w.dirty = false; const r = await WRITE[key](clone(w.get())); if (r.error) throw r.error; } while (w.dirty); }
    catch (e) { console.warn(e); toast("Couldn't save just now. Your next action will try again."); }
    finally { w.busy = false; w.dirty = false; }
  })();
}
const isWriting = (k) => !!(writers[k] && (writers[k].busy || writers[k].dirty));
const saveMember = () => { S.member.lastActive = new Date().toISOString(); syncProjectToMember(); persist("member", () => S.member); };
const saveBoard = () => { persist("board", () => S.board); saveMember(); };
function syncProjectToMember() {
  const p = S.board.project;

/* ---------- XP + days ---------- */
function addXP(n, why) {
  const before = levelOf(S.member.xp);
  S.member.xp += n;
  const after = levelOf(S.member.xp);
  if (after > before) { toast(`Level up! Lv ${after} · ${titleOf(after)}`); blip("level"); burst(60); }
  else if (why) toast(`+${n} XP · ${why}`);
}
function markDay() {
  const t = today();
  if (!S.member.days.includes(t)) { S.member.days.push(t); S.member.days.sort(); if (S.member.days.length > 400) S.member.days = S.member.days.slice(-400); }
}

/* ---------- sound + fx ---------- */
// Browsers only allow audio after the user has interacted with the page, and they
// suspend it again in background tabs. So the audio engine is created on the first
// click or key press, and resumed before every sound.
let actx = null, master = null;
function audio() {
  if (actx) return actx;
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
  actx = new AC();
  const comp = actx.createDynamicsCompressor();
  const lp = actx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 5200;
  master = actx.createGain(); master.gain.value = 0.5;
  master.connect(lp).connect(comp).connect(actx.destination);
  return actx;
}
function unlockAudio() { const a = audio(); if (a && a.state !== "running") a.resume().catch(() => {}); }
["pointerdown", "keydown", "touchstart"].forEach((ev) => addEventListener(ev, unlockAudio, { capture: true, passive: true }));
document.addEventListener("visibilitychange", () => { if (!document.hidden && actx) unlockAudio(); });

// Each sound is a list of [frequency Hz, start s, length s, wave, slideTo Hz?, volume?].
const SFX = {
  tap:   [[880, 0, 0.06, "triangle"]],
  start: [[262, 0, 0.12, "square", 523], [523, 0.12, 0.18, "triangle"]],
  quest: [[988, 0, 0.08, "square"], [1319, 0.08, 0.28, "square"]],
  level: [[523, 0, 0.1, "square"], [659, 0.1, 0.1, "square"], [784, 0.2, 0.1, "square"], [1047, 0.3, 0.4, "square"], [131, 0, 0.7, "triangle", null, 1.4]],
  run:   [[392, 0, 0.1, "square"], [523, 0.1, 0.1, "square"], [659, 0.2, 0.1, "square"], [784, 0.3, 0.12, "square"], [659, 0.42, 0.08, "square"], [1047, 0.5, 0.5, "square"], [196, 0, 0.5, "triangle", null, 1.4], [262, 0.5, 0.5, "triangle", null, 1.4]],
  fail:  [[392, 0, 0.18, "square", 330], [294, 0.2, 0.4, "square", 147]],
};
function blip(kind) {
  if (!S.sound) return;
  const a = audio(); if (!a) return;
  const play = () => {
    try {
      const t0 = a.currentTime + 0.03;
      for (const [f, at, len, wave, slide, vol] of SFX[kind] || SFX.tap) {
        const o = a.createOscillator(), g = a.createGain(), t = t0 + at, peak = 0.12 * (vol || 1) * (wave === "square" ? 0.6 : 1);
        o.type = wave; o.frequency.setValueAtTime(f, t);
        if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + len);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(peak, t + 0.008);
        g.gain.setValueAtTime(peak, t + Math.max(0.01, len * 0.6));
        g.gain.exponentialRampToValueAtTime(0.0001, t + len);
        o.connect(g).connect(master); o.start(t); o.stop(t + len + 0.02);
      }
    } catch {}
  };
  if (a.state === "running") play(); else a.resume().then(play, () => {});
}
const fx = $("#fx"), fctx = fx.getContext("2d");
let parts = [], fxRun = false;
function burst(n = 36) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  fx.width = innerWidth; fx.height = innerHeight;
  const cs = getComputedStyle(document.documentElement);
  const cols = ["--accent", "--xp", "--cool", "--good"].map((v) => cs.getPropertyValue(v).trim());
  for (let i = 0; i < n; i++) parts.push({ x: innerWidth / 2, y: innerHeight * 0.4, vx: (Math.random() - 0.5) * 14, vy: -Math.random() * 12 - 3, life: 60 + Math.random() * 30, c: cols[i % cols.length], s: 4 + ((Math.random() * 3) | 0) * 2 });
  if (!fxRun) { fxRun = true; requestAnimationFrame(fxStep); }
}
function fxStep() {
  fctx.clearRect(0, 0, fx.width, fx.height);
  parts = parts.filter((p) => p.life-- > 0);
  parts.forEach((p) => { p.x += p.vx; p.y += p.vy; p.vy += 0.45; p.vx *= 0.98; fctx.fillStyle = p.c; fctx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s); });
  if (parts.length) requestAnimationFrame(fxStep); else { fxRun = false; fctx.clearRect(0, 0, fx.width, fx.height); }
}
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 3200); }

const VIEWS = ["quests", "focus", "devlog", "party", "tavern", "ships", "admin"];
const view = () => { const h = location.hash.slice(1); return VIEWS.includes(h) && (h !== "admin" || isAdmin()) ? h : "quests"; };

/* ---------- render ---------- */
function render() {
  const app = $("#app");
  const act = document.activeElement, aid = act && act.id;
  let sel = null; if (aid && act.selectionStart != null) { try { sel = [act.selectionStart, act.selectionEnd]; } catch {} }
  const kept = {};
  app.querySelectorAll("[id][data-dirty]").forEach((el) => (kept[el.id] = el.type === "checkbox" ? el.checked : el.value));

  const v = view();
  if (S.phase !== "app") app.innerHTML = gateView();
  else {
    if (v === "tavern") markTavernSeen();
    app.innerHTML = header(v) + `<main class="wrap">${notices()}${({ quests: vQuests, focus: vFocus, devlog: vDevlog, party: vParty, tavern: vTavern, ships: vShips, admin: vAdmin }[v])()}</main>`;
  }

  for (const id in kept) { const el = document.getElementById(id); if (el) { if (el.type === "checkbox") el.checked = kept[id]; else el.value = kept[id]; el.dataset.dirty = "1"; } }
  if (aid) { const el = document.getElementById(aid); if (el) { el.focus({ preventScroll: true }); if (sel) try { el.setSelectionRange(sel[0], sel[1]); } catch {} } }
  tick();
}

  const unread = v === "tavern" ? 0 : tavernUnread();
  const tabs = [["quests", "Quests"], ["focus", S.focus ? "Focus ●" : "Focus"], ["devlog", "Devlog"], ["party", "Party"], ["tavern", unread ? `Tavern (${unread})` : "Tavern"], ["ships", "Ship Wall"]];

    <div class="brand"><span class="mark" aria-hidden="true"></span>Ship It</div>

      ${nCore > lim ? `<div class="banner warn"><span class="label">Scope alert</span><p>${nCore} core features for ${BOX[w.box].name}. Move ${nCore - lim} to Nice-to-have or Sequel, or you'll stall halfway.</p></div>` : `<p class="label num" style="color:var(--good)">${nCore} / ${lim} core · looks shippable</p>`}
      <div class="sortlist">${w.features.map((f, i) => `<div class="sortrow"><span class="t">${esc(f.t)}</span><span class="seg" role="group" aria-label="Bucket for ${esc(f.t)}">${["core", "nice", "sequel"].map((b) => `<button type="button" class="${b} ${f.b === b ? "sel" : ""}" aria-pressed="${f.b === b}" data-act="wiz-bucket" data-i="${i}" data-b="${b}">${{ core: "Core", nice: "Nice", sequel: "Sequel" }[b]}</button>`).join("")}</span></div>`).join("")}</div>
      <div class="row"><button class="btn primary" data-act="wiz-next2" ${nCore ? "" : "disabled"}>Next</button><button class="btn ghost" data-act="wiz-back">Back</button></div></div>`;
  }
  if (w.step === 3) {
    const by = (b) => w.features.filter((f) => f.b === b).map((f) => f.t);
    body = `<div class="stack">
      <h3>${esc(w.name)}</h3><p>${esc(w.pitch)}</p>
      <div class="grid2">
        <div class="stack" style="gap:6px"><span class="label">Becomes quests (${by("core").length})</span>${by("core").map((t) => `<div class="sortrow"><span class="t">${esc(t)}</span><span class="chip core">Core</span></div>`).join("")}</div>
        <div class="stack" style="gap:6px"><span class="label">Waits (${by("nice").length}) · Sequel vault (${by("sequel").length})</span>${by("nice").map((t) => `<div class="sortrow"><span class="t">${esc(t)}</span><span class="chip m">Nice</span></div>`).join("")}${by("sequel").map((t) => `<div class="sortrow"><span class="t muted">${esc(t)}</span><span class="chip">Sequel</span></div>`).join("")}</div>
      </div>
      <p class="muted">Deadline: ${esc(fmtDate(addDays(today(), BOX[w.box].days) + "T12:00"))}. Break big core quests into smaller ones once you start.</p>
      <div class="row"><button class="btn primary" data-act="wiz-create">Create project</button><button class="btn ghost" data-act="wiz-back">Back</button></div></div>`;
  }
  return `<section class="panel hero stack"><span class="label">Scope Slayer</span><h2>Cut it down until you can finish it.</h2>${steps}${body}</section>`;
}

/* ---------- Focus view ---------- */
function vFocus() {

  const runsToday = S.member._runsToday?.date === today() ? S.member._runsToday.n : 0;

  let main;

    main = `<div class="reward"><span class="label">Run complete</span><div class="big num">+${r.xp} XP</div><p>${r.mins} focused minutes${r.quest ? ` on <b>${esc(r.quest)}</b>` : ""}. The day counts toward your streak.${r.bonus ? ` Raid bonus: +${r.bonus} XP for focusing with your party.` : ""}</p>
      <div class="row">${r.questId && S.board.quests.find((q) => q.id === r.questId && q.status === "doing") ? `<button class="btn primary" data-act="q-move" data-id="${r.questId}" data-to="done">Mark quest done</button>` : ""}<button class="btn" data-act="f-dismiss">Another run</button><a class="btn ghost" href="#devlog" style="text-decoration:none">Write a devlog line</a></div></div>`;
  } else if (S.ui.lost) {
    main = `<div class="reward"><span class="label" style="color:var(--bad)">Run lost</span><div class="big" style="color:var(--bad)">You left the dungeon</div><p>You were away for ${Math.round(S.ui.lost / 1000)} seconds. Strict mode ends a run after 15 seconds away. No XP this time.</p><button class="btn primary" data-act="f-dismiss">Try again</button></div>`;

      ${f.raidId ? `<p class="label" style="text-align:center;color:var(--accent)">${raidMates(f.raidId).length ? "Raiding with " + raidMates(f.raidId).map((u) => esc(nm(u))).join(", ") : "Waiting for your party to join…"}</p>` : ""}
      <div class="timer running num" id="timer">--:--</div>

      <div class="row" style="justify-content:center">${S.ui.confirmAbandon ? `<span>Abandon this run? You get no XP.</span><button class="btn danger small" data-act="f-abandon-yes">Abandon</button><button class="btn ghost small" data-act="f-abandon-no">Keep going</button>` : `<button class="btn ghost" data-act="f-abandon">Abandon run</button>`}</div>
      <p class="muted" style="text-align:center">${f.strict ? "Stay on this tab. Leaving for more than 15 seconds ends the run." : "Relaxed mode: you can switch tabs."}</p></div>`;
  } else {
    main = `<form class="stack" data-form="focus-start">
      <div class="timer num">${pad(S.ui.dur)}:00</div>
      <div class="field"><span class="label">Run length</span><div class="row">${[10, 25, 50].map((m) => `<button type="button" class="btn ${S.ui.dur === m ? "on" : "ghost"}" data-act="f-dur" data-m="${m}" aria-pressed="${S.ui.dur === m}">${m} min${m === 10 ? " warm-up" : ""}</button>`).join("")}</div></div>
      <label class="field"><span class="label">Quest</span><select id="f-quest"><option value="">Free run (no quest)</option>${doing.map((q) => `<option value="${q.id}" ${S.ui.focusQuest === q.id ? "selected" : ""}>${esc(q.title)}</option>`).join("")}</select>
        ${doing.length ? "" : `<span class="muted">Start a quest on the Quests tab to tie runs to it.</span>`}</label>
      <label class="row" style="gap:8px"><input type="checkbox" id="f-strict" ${S.ui.strict ? "checked" : ""}> Strict mode: leaving the tab for 15+ seconds ends the run</label>
      <label class="row" style="gap:8px"><input type="checkbox" id="f-raid" ${S.ui.raid ? "checked" : ""}> Open as a raid: your party can join, and everyone gets +10 XP for focusing together</label>

    <div class="panel hero stack">${main}</div>
    <div class="stack">
      <div class="panel stack"><span class="label">Today</span><div class="stats"><div class="stat"><span class="label">Runs</span><b>${runsToday}</b></div><div class="stat"><span class="label">Minutes</span><b>${minsToday}</b></div><div class="stat"><span class="label">All-time hrs</span><b>${(S.member.totalMinutes / 60).toFixed(1)}</b></div></div>
        <p class="muted">1 XP per focused minute. Any finished run counts as showing up today.</p></div>
      <div class="panel stack"><span class="label">Focusing right now</span>${others.length ? others.map(([id, x]) => {
        const canJoin = x.open && x.raidId && !S.focus && x.endsAt - Date.now() > 120000;
        return `<div class="row between"><span class="row" style="flex-wrap:nowrap;min-width:0">${avatar(id)}<span style="min-width:0"><b>${esc(nm(id))}</b>${x.open ? ` <span class="chip core">Raid</span>` : ""}<span class="muted" style="display:block">${x.quest ? esc(String(x.quest).slice(0, 80)) : "Free run"} · <span class="num" data-ends="${x.endsAt}">${Math.max(0, Math.ceil((x.endsAt - Date.now()) / 60000))}</span> min left</span></span></span>
          ${canJoin ? `<button class="btn small primary" data-act="raid-join" data-raid="${esc(x.raidId)}" data-ends="${x.endsAt}">Join raid</button>` : ""}</div>`; }).join("") : `<p class="empty">Nobody else is in a run. Start a raid and your party can join you.</p>`}</div>
    </div></section>`;
}

/* ---------- Devlog view ---------- */
function vDevlog() {
  const logs = [...S.member.logs].sort((a, b) => b.t.localeCompare(a.t));

}

/* ---------- Party view ---------- */
const cheerKey = (author, logId) => `${author}:${logId}`;
const cheerCount = (author, logId) => Object.values(S.cheers).filter((c) => c && c.given && c.given[cheerKey(author, logId)]).length;
function vParty() {
  const ms = allMembers(), live = liveFocusers(), m = month();
  const ids = Object.keys(ms).sort((a, b) => (ms[b].xp || 0) - (ms[a].xp || 0));
  const groupMins = ids.reduce((s, id) => s + ((ms[id].monthMinutes || {})[m] || 0), 0);
  const goal = S.settings.goalHours || 0;
  const feed = [];
  ids.forEach((id) => (ms[id].logs || []).forEach((l) => feed.push({ id, l })));
  feed.sort((a, b) => b.l.t.localeCompare(a.l.t));
  const mine = (S.cheers[myId()] && S.cheers[myId()].given) || {};
  return `
  ${onlineStrip()}
  ${goal ? `<section class="panel stack"><div class="row between"><span class="label">Group goal this month</span><span class="label num">${(groupMins / 60).toFixed(1)} / ${goal} hrs</span></div><div class="meter xp"><i style="width:${Math.min(100, (groupMins / 60 / goal) * 100)}%"></i></div></section>` : ""}
  <section class="stack"><div class="row between"><h2>Your party</h2><span class="label">${ids.length} member${ids.length === 1 ? "" : "s"} · ${Object.keys(live).length} focusing now</span></div>
    ${ids.length <= 1 ? `<p class="muted">Just you so far. ${isAdmin() ? "Invite friends from the Admin tab." : ""}</p>` : ""}
    <div class="members">${ids.map((id) => memberCard(id, ms[id], live[id])).join("")}</div></section>
  <section class="stack"><h2>Devlog feed</h2>
    ${feed.length ? `<div class="feed">${feed.slice(0, 40).map(({ id, l }) => { const k = cheerKey(id, l.id), n = cheerCount(id, l.id), on = !!mine[k], th = thread(`l:${id}:${l.id}`);
      return `<div class="entry">${avatar(id)}<div class="body"><div class="row between"><b>${esc(nm(id))}</b><span class="label">${esc(fmtDate(l.t))}</span></div><div class="txt">${esc(l.text)}</div>${safeUrl(l.link) ? `<a href="${esc(safeUrl(l.link))}" target="_blank" rel="noopener">${esc(l.link.slice(0, 60))}</a>` : ""}
        <div class="row">${id !== myId() && S.uid ?`<button class="btn small ${on ? "on" : "ghost"}" data-act="cheer" data-k="${esc(k)}" aria-pressed="${on}">High-five${n ? " · " + n : ""}</button>` : `<span class="hf muted">${n} high-five${n === 1 ? "" : "s"}</span>`}${th.btn}</div>${th.body}</div></div>`; }).join("")}</div>` : `<p class="empty">No devlog posts yet. The first one sets the tone.</p>`}
  </section>`;
}
function memberCard(id, m, live) {
  m = normMember(m);
  const lv = levelOf(m.xp), st = streakOf(m.days), dl = daysLeft(m.deadline), b = badgesOf(m);
  return `<article class="mcard ${live ? "live" : ""}">
    <div class="mhead">${avatar(id)}<div style="min-width:0"><div class="n">${esc(nm(id))}${id === myId() ? ` <span class="label">(you)</span>` : ""}</div><div class="label">Lv ${lv} · ${esc(titleOf(lv))}</div></div></div>
    ${live ? `<div><span class="livedot"></span><b>In a focus run</b>${live.quest ? `: ${esc(String(live.quest).slice(0, 80))}` : ""}</div>` : ""}
    <div class="stats"><div class="stat"><span class="label">Streak</span><b>${st.streak}</b></div><div class="stat"><span class="label">Hrs/mo</span><b>${(((m.monthMinutes || {})[month()] || 0) / 60).toFixed(1)}</b></div><div class="stat"><span class="label">Shipped</span><b>${m.ships.length}</b></div></div>
    ${m.projectName ? `<div><span class="label">Building</span> <b>${esc(m.projectName)}</b>${dl != null ? ` <span class="muted">· ${dl >= 0 ? dl + "d left" : Math.abs(dl) + "d over"}</span>` : ""}</div>` : ""}
    ${m.activeQuest ? `<div class="muted"><span class="label">Quest</span> ${esc(m.activeQuest)}</div>` : ""}
    ${b.length ? `<div class="badges">${b.map((x) => `<span class="badge">${esc(x)}</span>`).join("")}</div>` : ""}

}

/* ---------- community: tavern, threads, online ---------- */
const TAGS = { chat: "Chat", help: "Help", showcase: "Showcase", playtest: "Playtest" };
const TAG_HINT = { chat: "Anything game-dev", help: "Stuck on something? Ask the party", showcase: "Show off a GIF, a level, a mechanic", playtest: "Ask people to try your build" };
const idsafe = (k) => String(k).replace(/[^A-Za-z0-9_-]/g, "_");
const hiddenSet = () => S.settings.hidden || {};
function allPosts() {
  const out = [];
  Object.entries(allMembers()).forEach(([by, m]) => (m.posts || []).forEach((p) => out.push(Object.assign({ by, key: `p:${by}:${p.id}` }, p))));
  return out.filter((p) => !hiddenSet()[p.key]);
}
function allReplies() {
  const out = [];
  Object.entries(allMembers()).forEach(([by, m]) => (m.replies || []).forEach((r) => out.push(Object.assign({ by, key: `r:${by}:${r.id}` }, r))));
  return out.filter((r) => !hiddenSet()[r.key]);
}
const repliesTo = (key) => allReplies().filter((r) => r.to === key).sort((a, b) => a.t.localeCompare(b.t));
const ownerOf = (key) => String(key).split(":")[1];
function tavernUnread() {
  const seen = ls.get("shipit.seen") || "";
  if (!seen) return 0;
  const me = myId();
  const posts = allPosts().filter((p) => p.by !== me && p.t > seen).length;
  const replies = allReplies().filter((r) => r.by !== me && r.t > seen && ownerOf(r.to) === me).length;
  return posts + replies;
}
function markTavernSeen() {
  S.ui.prevSeen = S.ui.prevSeen ?? (ls.get("shipit.seen") || "");
  ls.set("shipit.seen", new Date().toISOString());
}
function cheerBtn(key) {
  const n = Object.values(S.cheers).filter((c) => c && c.given && c.given[key]).length;
  const mine = !!(((S.cheers[myId()] || {}).given || {})[key]);
  if (ownerOf(key) === myId()) return `<span class="hf muted">${n} high-five${n === 1 ? "" : "s"}</span>`;
  return `<button class="btn small ${mine ? "on" : "ghost"}" data-act="cheer" data-k="${esc(key)}" aria-pressed="${mine}">High-five${n ? " · " + n : ""}</button>`;
}
function modBtns(key) {
  const own = ownerOf(key) === myId();
  let h = "";
  if (own) h += `<button class="btn ghost small" data-act="del-own" data-k="${esc(key)}">Delete</button>`;
  else if (isAdmin()) h += `<button class="btn ghost small danger" data-act="hide" data-k="${esc(key)}">Hide</button>`;
  return h;
}
function thread(key, label = "Reply") {
  const reps = repliesTo(key), open = !!S.ui.open[key];
  const btn = `<button class="btn ghost small" data-act="thread" data-k="${esc(key)}" aria-expanded="${open}">${esc(label)}${reps.length ? " · " + reps.length : ""}</button>`;
  if (!open) return { btn, body: "" };
  const body = `<div class="thread">
    ${reps.map((r) => `<div class="reply">${avatar(r.by)}<div class="body"><div class="row between"><b>${esc(nm(r.by))}</b><span class="label">${esc(fmtDate(r.t))}</span></div><div class="txt">${esc(r.body)}</div><div class="row">${modBtns(r.key)}</div></div></div>`).join("")}
    <form class="row" data-form="reply" data-k="${esc(key)}"><input type="text" id="rp-${idsafe(key)}" maxlength="500" placeholder="Write a reply" required style="flex:1 1 200px"><button class="btn small cool" type="submit">Send</button></form></div>`;
  return { btn, body };
}
function onlineNow() {
  const seen = new Map();
  for (const p of S.peers) if (p.uid && !seen.has(p.uid)) seen.set(p.uid, p);
  if (S.uid && !seen.has(S.uid)) seen.set(S.uid, { uid: S.uid, focus: S.focus });
  return [...seen.values()];
}
function onlineStrip() {
  const on = onlineNow(), now = Date.now();
  return `<div class="panel row" style="gap:8px 14px"><span class="label">Online now · ${on.length}</span>
    ${on.map((p) => `<span class="online">${avatar(p.uid)}<span>${esc(nm(p.uid))}${p.uid === myId() ? " (you)" : ""}</span>${p.focus && p.focus.endsAt > now ? `<span class="livedot" title="In a focus run"></span>` : ""}</span>`).join("")}</div>`;
}
function vTavern() {
  const tag = S.ui.tag || "all", prevSeen = S.ui.prevSeen || "";
  const lastAct = (p) => [p.t, ...repliesTo(p.key).map((r) => r.t)].sort().pop();
  const posts = allPosts().filter((p) => tag === "all" || p.tag === tag).sort((a, b) => lastAct(b).localeCompare(lastAct(a)));
  const ptag = S.ui.postTag || "chat";
  return `${onlineStrip()}
  <section class="panel hero stack"><span class="label">Tavern</span><h2>Talk shop with your party.</h2>
    <form class="stack" data-form="post">
      <div class="row" role="group" aria-label="Post type">${Object.entries(TAGS).map(([k, n]) => `<button type="button" class="btn small ${ptag === k ? "on" : "ghost"}" data-act="post-tag" data-t="${k}" aria-pressed="${ptag === k}">${n}</button>`).join("")}</div>
      <p class="muted">${esc(TAG_HINT[ptag])}${ptag === "help" ? ". Whoever helps earns XP." : "."}</p>
      <label class="field"><span class="label">Title</span><input type="text" id="po-title" maxlength="100" required placeholder="${ptag === "help" ? "My jump feels floaty, how do I fix it?" : ptag === "playtest" ? "Lantern Diver build 3, 5 minutes" : ptag === "showcase" ? "Got the water shader working" : "What's everyone working on this week?"}"></label>
      <label class="field"><span class="label">Details (optional)</span><textarea id="po-body" maxlength="1500" rows="3"></textarea></label>
      <div class="row" style="align-items:end"><label class="field grow"><span class="label">Link (build, GIF, video, optional)</span><input type="url" id="po-link" maxlength="300" placeholder="https://"></label><button class="btn primary" type="submit">Post</button></div>
    </form></section>
  <section class="stack">
    <div class="row" role="group" aria-label="Filter posts">${[["all", "All"], ...Object.entries(TAGS)].map(([k, n]) => `<button class="btn small ${tag === k ? "on" : "ghost"}" data-act="tag-filter" data-t="${k}" aria-pressed="${tag === k}">${n}</button>`).join("")}</div>
    ${posts.length ? posts.map((p) => { const th = thread(p.key, p.tag === "help" ? "Help out" : p.tag === "playtest" ? "Give feedback" : "Reply"); const isNew = prevSeen && p.by !== myId() && lastAct(p) > prevSeen;
      return `<article class="post ${isNew ? "new" : ""}"><div class="row between"><span class="row" style="gap:8px;flex-wrap:nowrap;min-width:0">${avatar(p.by)}<b>${esc(nm(p.by))}</b></span><span class="row" style="gap:6px">${isNew ? `<span class="chip core">New</span>` : ""}<span class="chip tag-${esc(p.tag)}">${esc(TAGS[p.tag] || "Chat")}</span><span class="label">${esc(fmtDate(p.t))}</span></span></div>
        <h3>${esc(p.title)}</h3>${p.body ? `<p class="txt">${esc(p.body)}</p>` : ""}${safeUrl(p.link) ? `<a href="${esc(safeUrl(p.link))}" target="_blank" rel="noopener">${esc(p.link.slice(0, 70))}</a>` : ""}
        <div class="row">${cheerBtn(p.key)}${th.btn}${modBtns(p.key)}</div>${th.body}</article>`; }).join("")
      : `<p class="empty">${tag === "all" ? "Nothing here yet. Ask a question, share a GIF, or ask for playtesters." : "No " + esc(TAGS[tag]) + " posts yet."}</p>`}
  </section>`;
}

/* ---------- Ship wall ---------- */
function vShips() {
  const ms = allMembers(), all = [];

    <div class="row">${safeUrl(s.link) ? `<a class="btn cool small" style="text-decoration:none" href="${esc(safeUrl(s.link))}" target="_blank" rel="noopener">Play it</a>` : ""}${cheerBtn(key)}${th.btn}</div>${th.body}</article>`; }).join("")}</section>`
  : `<section class="panel stack"><p class="empty">Nothing shipped yet. The first game on this wall gets the most high-fives. Hit <b>Ship it</b> on your project when it's playable.</p></section>`}`;
}

/* ---------- Admin ---------- */
function vAdmin() {
  const ms = allMembers(), m = month(), s = S.settings, c = s.challenge || {};

/* ---------- focus timer ---------- */
function saveFocus() { if (S.focus) ls.set("shipit.focus", S.focus); else ls.del("shipit.focus"); }
function setPresence() {
  if (!S.chan || !S.chanReady) return;
  const f = S.focus;
  S.chan.track({ uid: S.uid, focus: f ? { endsAt: f.endsAt, quest: questTitle(f.questId).slice(0, 120), mins: f.mins, raidId: f.raidId || null, open: !!f.open } : null }).catch(() => {});
}
// raid: null for a solo run, {open:true} to host a raid, or {raidId, endsAt} to join one.
function startRun(mins, questId, strict, raid) {
  const now = Date.now();
  let endsAt = now + mins * 60000, raidId = null, open = false;
  if (raid && raid.raidId) { endsAt = raid.endsAt; raidId = raid.raidId; open = true; mins = Math.max(1, Math.round((endsAt - now) / 60000)); }
  else if (raid && raid.open) { raidId = S.uid + "-" + now.toString(36); open = true; }
  S.focus = { startedAt: now, endsAt, mins, questId, strict, hiddenAt: null, lastSeen: now, raidId, open, party: false };
  S.ui.reward = null; S.ui.lost = null; S.ui.confirmAbandon = false;
  saveFocus(); setPresence(); blip("start");
  try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch {}
  render();
}
function endRun() { S.focus = null; saveFocus(); setPresence(); }
function failRun(away) { endRun(); S.ui.lost = away; blip("fail"); render(); }
function completeRun() {
  const f = S.focus; endRun();
  const mins = f.mins, m = S.member;
  m.totalMinutes += mins; m.runs += 1;
  m.monthMinutes[month()] = (m.monthMinutes[month()] || 0) + mins;
  m._runsToday = { date: today(), n: (m._runsToday?.date === today() ? m._runsToday.n : 0) + 1 };
  m._minsToday = { date: today(), n: (m._minsToday?.date === today() ? m._minsToday.n : 0) + mins };
  markDay();
  const bonus = f.party ? 10 : 0;
  if (bonus) m.raids = (m.raids || 0) + 1;
  S.ui.reward = { xp: mins + bonus, mins, bonus, quest: questTitle(f.questId), questId: f.questId };
  addXP(mins + bonus); blip("run"); burst(f.party ? 120 : 70);
  saveMember(); render();
}
function tick() {
  const f = S.focus;
  if (f) {
    const now = Date.now();
    if (!document.hidden) { f.lastSeen = now; }
    if (f.raidId && !f.party && raidMates(f.raidId).length) { f.party = true; saveFocus(); }
    if (now >= f.endsAt && !document.hidden) { completeRun(); return; }
    const left = Math.max(0, f.endsAt - now), mm = Math.floor(left / 60000), ss = Math.floor((left % 60000) / 1000);
    const t = $("#timer"); if (t) t.textContent = pad(mm) + ":" + pad(ss);
    const p = Math.min(100, ((now - f.startedAt) / (f.endsAt - f.startedAt)) * 100);
    const bar = $("#fbar"), dot = $("#fdot"); if (bar) bar.style.width = p + "%"; if (dot) dot.style.left = p + "%";
  }
  document.querySelectorAll("[data-ends]").forEach((el) => (el.textContent = Math.max(0, Math.ceil((+el.dataset.ends - Date.now()) / 60000))));
}
setInterval(() => { tick(); if (S.focus && Date.now() - (S._lastFocusSave || 0) > 5000) { S._lastFocusSave = Date.now(); saveFocus(); } }, 250);
document.addEventListener("visibilitychange", () => {
  const f = S.focus; if (!f) return;
  if (document.hidden) { f.hiddenAt = Date.now(); saveFocus(); return; }
  if (f.hiddenAt) {
    const away = Math.min(Date.now(), f.endsAt) - f.hiddenAt; f.hiddenAt = null;
    if (f.strict && away > 15000) { failRun(away); return; }
  }
  saveFocus(); tick();
});
(function restoreFocus() {
  const f = ls.get("shipit.focus");
  if (!f || typeof f.endsAt !== "number") return;
  const now = Date.now(), gap = Math.min(now, f.endsAt) - (f.lastSeen || f.startedAt);
  if (f.strict && gap > 15000) { ls.del("shipit.focus"); S.ui.lost = gap; return; }
  S.focus = f; f.hiddenAt = null;
})();

/* ---------- actions ---------- */
function moveQuest(id, to) {
  const q = S.board.quests.find((x) => x.id === id); if (!q) return;
  if (to === "doing" && q.status !== "doing" && S.board.quests.filter((x) => x.status === "doing").length >= 3) { toast("3 quests in progress already. Finish one first."); blip("fail"); return; }
  if (to === "done" && q.status !== "done") {
    q.doneAt = new Date().toISOString(); S.member.questsDone++; if (q.size === "b") S.member.bossDone++;
    markDay(); addXP(QUEST_XP[q.size], "Quest complete"); blip("quest"); burst(q.size === "b" ? 80 : 30);
    if (S.ui.reward && S.ui.reward.questId === id) S.ui.reward.questId = null;
  }
  q.status = to; saveBoard(); render();
}

      const r = await S.sb.auth.signUp({ email: $("#g-email", f).value.trim(), password: $("#g-pass", f).value, options: { emailRedirectTo: location.origin + location.pathname } });
      if (r.error) throw r.error;
      if (!r.data.session) S.gate.info = "Check your email and click the confirmation link, then sign in here.";
    });
  },
  redeem(f) {
    const name = $("#g-name", f).value.trim(), code = (($("#g-code", f) || {}).value || "").trim().toUpperCase();
    gateSubmit(() => redeem(name, code));
  },
};
async function gateSubmit(fn) {
  S.gate.busy = true; S.gate.err = ""; S.gate.info = ""; render();
  try { await fn(); } catch (e) { S.gate.err = (e && e.message) || "Something went wrong. Try again."; }
  S.gate.busy = false; render();
}
async function redeem(name, code) {
  const r = await S.sb.rpc("redeem_invite", { p_code: code, p_name: name });
  if (r.error) throw r.error;
  ls.del("shipit.pending");
  if (inviteFromUrl()) history.replaceState(null, "", location.pathname + location.hash);
  if (r.data === "admin") toast("You're the admin. Invite friends from the Admin tab.");
  await enterApp();
}
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el); }
});
document.addEventListener("submit", (e) => {
  e.preventDefault();
  const f = e.target, fn = FORM[f.dataset.form];
  if (fn && fn(f)) { f.querySelectorAll("[data-dirty]").forEach((x) => delete x.dataset.dirty); render(); }
});
document.addEventListener("input", (e) => { if (e.target.id) e.target.dataset.dirty = "1"; });

/* ---------- data loading ---------- */
async function loadTable(t) {
  if (t === "profiles") {
    const r = await S.sb.from("profiles").select("id,display_name,role");
    if (!r.error) { S.profiles = Object.fromEntries(r.data.map((p) => [p.id, p])); S.role = S.profiles[S.uid] ? S.profiles[S.uid].role : null; }
  } else if (t === "members") {
    const r = await S.sb.from("members").select("id,data");
    if (!r.error) {
      S.members = Object.fromEntries(r.data.map((x) => [x.id, normMember(x.data)]));
      if (S.members[S.uid] && !isWriting("member")) S.member = normMember(clone(S.members[S.uid]));
    }
  } else if (t === "cheers") {
    const r = await S.sb.from("cheers").select("id,given");
    if (!r.error) { const c = Object.fromEntries(r.data.map((x) => [x.id, { given: x.given || {} }])); if (isWriting("cheers")) c[S.uid] = S.cheers[S.uid]; S.cheers = c; }
  } else if (t === "settings") {
    const r = await S.sb.from("settings").select("data").eq("id", 1).maybeSingle();
    if (!r.error && !isWriting("settings")) S.settings = Object.assign({ announcement: "", challenge: null, goalHours: 0 }, (r.data && r.data.data) || {});
  } else if (t === "board") {
    const r = await S.sb.from("boards").select("data").eq("id", S.uid).maybeSingle();
    if (!r.error && r.data && !isWriting("board")) S.board = normBoard(r.data.data);
  }
}
async function loadInvites() {
  if (!isAdmin()) { S.invites = []; return; }
  const r = await S.sb.from("invites").select("*").order("created_at", { ascending: false }).limit(50);
  if (!r.error) S.invites = r.data;
}
const refetchTimers = {};
function refetchSoon(t) {
  clearTimeout(refetchTimers[t]);
  refetchTimers[t] = setTimeout(async () => {
    await loadTable(t);
    if (t === "profiles") { if (!S.role) { await leaveApp(); return; } await loadInvites(); }
    render();
  }, 300);
}

/* ---------- session ---------- */
async function enterApp() {
  await loadTable("profiles");
  if (!S.role) {
    const nr = await S.sb.rpc("needs_admin"); S.needsAdmin = !!nr.data;
    const pend = ls.get("shipit.pending");
    if (pend && pend.name) { try { await redeem(pend.name, pend.code); return; } catch (e) { ls.del("shipit.pending"); S.gate.err = e.message; } }
    S.phase = "redeem"; render(); return;
  }
  await Promise.all([loadTable("members"), loadTable("cheers"), loadTable("settings"), loadTable("board"), loadInvites()]);
  S.phase = "app"; render();
  subscribe();
}
async function leaveApp() {
  if (S.chan) { try { await S.sb.removeChannel(S.chan); } catch {} S.chan = null; S.chanReady = false; }
  S.role = null; S.member = blankMember(); S.board = blankBoard(); S.members = {}; S.cheers = {}; S.profiles = {}; S.invites = []; S.peers = [];
}
function subscribe() {
  if (S.chan) return;
  const ch = S.sb.channel("party", { config: { presence: { key: S.uid } } });
  ["profiles", "members", "cheers", "settings"].forEach((t) => ch.on("postgres_changes", { event: "*", schema: "public", table: t }, () => refetchSoon(t)));
  ch.on("presence", { event: "sync" }, () => {
    const st = ch.presenceState();
    S.peers = Object.values(st).map((arr) => arr[arr.length - 1]).filter(Boolean).map((p) => ({ uid: p.uid, focus: p.focus }));
    if (S.phase === "app" && ["party", "focus", "tavern"].includes(view())) render();
  });
  ch.subscribe((status) => {
    if (status === "SUBSCRIBED") {
      S.chanReady = true; if (S.conn !== "ok") { S.conn = "ok"; ["profiles", "members", "cheers", "settings"].forEach(refetchSoon); }
      setPresence(); render();
    } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") { S.chanReady = false; if (S.phase === "app") { S.conn = "slow"; render(); } }
  });
  S.chan = ch;
}

/* ---------- boot ---------- */
render();
(async function boot() {
  if (!CFG.supabaseUrl || !CFG.supabaseKey || !window.supabase) { S.phase = "unconfigured"; render(); return; }
  S.sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey);
  let current;
  const onSession = async (session) => {
    const uid = session ? session.user.id : null;
    if (uid === current) return;
    current = uid;
    if (!uid) {
      await leaveApp(); S.uid = null; S.email = "";
      const nr = await S.sb.rpc("needs_admin"); S.needsAdmin = !!nr.data;
      if (S.needsAdmin && S.gate.tab === "signin" && !S.gate.err) S.gate.tab = "join";
      S.phase = "signin"; render(); return;
    }
    S.uid = uid; S.email = session.user.email || "";
    S.phase = "loading"; render();
    try { await enterApp(); } catch (e) { console.error(e); S.phase = "signin"; S.gate.err = "Couldn't load your data. Check that the database setup ran."; render(); }
  };
  S.sb.auth.onAuthStateChange((_ev, session) => { setTimeout(() => onSession(session), 0); });
  const { data } = await S.sb.auth.getSession();
  onSession(data.session);
})();
})();
</script>
